[project]
name = "opentuberecommendations"
version = "0.1.0"
description = "Локальный анонимный рекомендатель YouTube (свой фид)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx[socks]>=0.27",
    "yt-dlp>=2025.10.0",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "langdetect>=1.0.9",
    "huggingface-hub>=0.24",
    "pillow>=10",
]

[project.optional-dependencies]
# Installed only on explicit user action (button in the model manager or `uv sync --extra ...`).
embed = ["sentence-transformers>=3.0"]
asr = ["faster-whisper>=1.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
